plugins {
    id 'com.android.application'
}

android {
    namespace 'org.eclipse.stream'
    compileSdk 34
    // The NDK is installed by CI (see .github/workflows/build-android.yml).
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.eclipse.stream'
        minSdk 28          // Shield TV runs Android 9+ (API 28) on current firmware
        targetSdk 34
        versionCode 1
        versionName '0.1.0-android'
        ndk {
            // NVIDIA Shield TV (2015/2017/2019 and Pro) are all ARM64.
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // Native libraries produced by android/scripts/build-native.sh
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        // ONE FIXED KEY FOR EVERY BUILD. A debug key generated per CI run made each APK
        // look like a different app to Android, so `adb install -r` was refused and the
        // app had to be uninstalled first, losing pairing and settings. With a stable
        // key a new build installs over the old one as a plain update.
        // This is a test key for a private repo; use your own keystore to distribute.
        fixed {
            storeFile file('eclipse-port.keystore')
            storePassword 'eclipseport'
            keyAlias 'eclipseport'
            keyPassword 'eclipseport'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
