plugins {
    id 'com.android.application'
}

android {
    namespace 'org.eclipse.stream'
    compileSdk 34
    // The NDK is installed by CI (see .github/workflows/build-android.yml).
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.eclipse.stream'
        minSdk 28          // Shield TV runs Android 9+ (API 28) on current firmware
        targetSdk 34
        versionCode 1
        versionName '0.1.0-android'
        ndk {
            // NVIDIA Shield TV (2015/2017/2019 and Pro) are all ARM64.
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // Native libraries produced by android/scripts/build-native.sh
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            // Signed with the debug key so the APK installs on a Shield via adb or a file manager.
            // Use your own keystore for anything you distribute.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
