name: Build Android (NVIDIA Shield / Android TV)

# Produces an installable arm64 APK. First-draft pipeline: expect to fix dependency versions or
# compiler errors on the first runs. Download the APK from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - '.github/workflows/build-android.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config cmake

      - name: Build native libraries
        run: bash android/scripts/build-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/eclipse-android-arm64.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-android-arm64
          path: dist/eclipse-android-arm64.apk
          if-no-files-found: error

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            android/build/b-*/CMakeFiles/CMakeError.log
            android/build/b-*/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
