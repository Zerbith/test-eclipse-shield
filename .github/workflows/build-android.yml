name: Build Android (NVIDIA Shield / Android TV)

# Produces an installable arm64 APK. First-draft pipeline: expect to fix dependency versions or
# compiler errors on the first runs. Download the APK from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'core/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner image already ships the Android SDK (ANDROID_HOME) and sdkmanager, so no
      # setup action is needed. (android-actions/setup-android failed with "Failed to find
      # package 'tools'".)
      - name: Install SDK and NDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config cmake patchelf

      - name: Build native libraries
        shell: bash
        run: |
          set -o pipefail
          bash android/scripts/build-native.sh 2>&1 | tee build-native.log
      - name: Report native build errors
        if: failure()
        shell: bash
        run: |
          # Surface the first errors as annotations so they can be read without downloading logs.
          { grep -nE 'FAILED:|error:|undefined reference|undefined symbol|CMake Error' build-native.log || true; } | head -25 | cut -c1-600 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
          echo "::warning::lines=$(wc -l < build-native.log) $(df -h / | tail -1) $(free -m | sed -n 2p)"; grep -n 'ninja: \|FAILED\|\.so$\|Killed\|signal' build-native.log | tail -8 | cut -c1-300 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
          sed -n '/shared objects found/,/was not produced/p' build-native.log | head -45 | cut -c1-300 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
          tail -n 3 build-native.log | cut -c1-400 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done

      - name: Remove third-party Gradle wrapper jars (not used)
        run: find android/build -name gradle-wrapper.jar -delete

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK
        run: gradle -p android :app:assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName="0.1.${{ github.run_number }}-${GITHUB_SHA::7}"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/eclipse-android-arm64.apk
          ls -l dist

      # Publish the APK as the rolling release the in-app updater reads (private repo: the app
      # needs a read-only token). Only for pushes to main.
      - name: Publish APK for the in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/eclipse-android-arm64.apk "dist/eclipse-android-${{ github.run_number }}.apk"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "dist/eclipse-android-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Rolling build for the in-app updater." --prerelease --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-android-arm64
          path: dist/eclipse-android-arm64.apk
          if-no-files-found: error

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            android/build/b-*/CMakeFiles/CMakeError.log
            android/build/b-*/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
